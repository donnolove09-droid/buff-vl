<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FF Buff</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at top, #1e293b 0%, #0f172a 70%);
    min-height: 100vh; color: #e2e8f0;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .box {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    backdrop-filter: blur(10px);
    border-radius: 18px;
    padding: 28px 24px;
    width: 100%; max-width: 440px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
  }
  h1 {
    font-size: 20px; text-align: center; margin-bottom: 4px;
    background: linear-gradient(90deg,#60a5fa,#a78bfa,#f472b6);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .sub { text-align: center; font-size: 12px; color: #94a3b8; margin-bottom: 22px; }
  input {
    width: 100%; padding: 14px 16px;
    background: rgba(0,0,0,0.35);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px; color: #fff;
    font-size: 16px; outline: none; letter-spacing: 1px;
    transition: border-color .2s;
  }
  input:focus { border-color: #60a5fa; }
  button {
    width: 100%; margin-top: 12px;
    padding: 14px; border: none; border-radius: 12px;
    background: linear-gradient(135deg,#3b82f6,#8b5cf6);
    color: #fff; font-size: 15px; font-weight: 700;
    cursor: pointer; letter-spacing: .5px;
    transition: transform .1s, opacity .2s;
  }
  button:active { transform: scale(.98); }
  button:disabled { opacity: .6; cursor: not-allowed; }

  .results { margin-top: 18px; display: none; }
  .results.show { display: block; }
  .player {
    font-size: 13px; color: #94a3b8; text-align: center;
    margin-bottom: 12px;
  }
  .player b { color: #fff; }
  .row {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 12px 14px; border-radius: 12px;
    background: rgba(0,0,0,0.3); margin-bottom: 8px;
    border-left: 4px solid #64748b;
    animation: fade .3s ease;
  }
  .row.ok    { border-left-color: #10b981; }
  .row.fail  { border-left-color: #ef4444; }
  .row .tag {
    font-size: 11px; font-weight: 700; letter-spacing: .5px;
    padding: 3px 8px; border-radius: 6px;
    background: rgba(255,255,255,0.08); color: #cbd5e1;
    white-space: nowrap; margin-top: 2px;
  }
  .row .info { flex: 1; font-size: 13px; line-height: 1.5; }
  .row .info .status { font-weight: 700; margin-bottom: 2px; }
  .row.ok   .status { color: #34d399; }
  .row.fail .status { color: #f87171; }
  .row .info .detail { color: #94a3b8; font-size: 12px; word-break: break-word; }

  .spinner {
    display: inline-block; width: 14px; height: 14px;
    border: 2px solid rgba(255,255,255,.3); border-top-color: #fff;
    border-radius: 50%; animation: spin .6s linear infinite;
    vertical-align: middle; margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; } }
</style>
</head>
<body>
  <div class="box">
    <h1>Buff FF BUY VDON</h1>
    <p class="sub">Nhập UID → Like + Visit + Spam</p>

    <input id="uid" type="text" inputmode="numeric" placeholder="Nhập UID (6-15 số)" maxlength="15" />
    <button id="btn" onclick="run()">BUFF NGAY</button>

    <div id="results" class="results"></div>
  </div>

<script>
const $ = id => document.getElementById(id);
let busy = false;

async function run() {
  if (busy) return;
  const uid = $("uid").value.trim();
  if (!/^\d{6,15}$/.test(uid)) {
    alert("UID không hợp lệ (chỉ số, 6-15 ký tự)");
    return;
  }

  busy = true;
  $("btn").disabled = true;
  $("btn").innerHTML = '<span class="spinner"></span>Đang buff...';
  const res = $("results");
  res.className = "results show";
  res.innerHTML = '<div class="player">⏳ Đang gửi yêu cầu cho UID <b>' + uid + '</b>...</div>';

  try {
    const r = await fetch("/api/buff", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ uid })
    });
    const d = await r.json();

    if (!d.ok) {
      res.innerHTML = '<div class="player" style="color:#f87171">❌ ' + (d.error || "Lỗi không xác định") + '</div>';
      return;
    }

    let html = '<div class="player">👤 <b>' + (d.nickname || uid) + '</b> · ' + d.region + '</div>';
    for (const item of d.results) {
      const cls = item.ok ? "ok" : "fail";
      const status = item.ok ? "✅ Thành công" : "❌ Thất bại";
      html += `
        <div class="row ${cls}">
          <span class="tag">${item.name}</span>
          <div class="info">
            <div class="status">${status}</div>
            <div class="detail">${item.detail || ""}</div>
          </div>
        </div>`;
    }
    res.innerHTML = html;
  } catch (e) {
    res.innerHTML = '<div class="player" style="color:#f87171">❌ Lỗi mạng: ' + e.message + '</div>';
  } finally {
    busy = false;
    $("btn").disabled = false;
    $("btn").innerHTML = "BUFF NGAY";
  }
}

$("uid").addEventListener("keydown", e => { if (e.key === "Enter") run(); });
</script>
</body>
</html>
